name: Deploy to Cloudflare Workers
run-name: Xget deploy ${{ inputs.active_region || 'current' }} ${{ inputs.request_id }}

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      active_region:
        description: Default Worker region (empty preserves current selection)
        required: false
        type: string
      deploy_all:
        description: Deploy all four regional Workers
        type: boolean
        default: true
      inspect_only:
        description: Read live placement settings without deploying
        type: boolean
        default: false
      request_id:
        description: Client request identifier
        required: false
        type: string

concurrency:
  group: xget-production
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.76.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Wrangler CLI
        run: npm install --global wrangler@${{ env.WRANGLER_VERSION }}

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTIVE_REGION: ${{ inputs.active_region }}
          INSPECT_ONLY: ${{ inputs.inspect_only }}
          DEPLOY_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_all == false && 'false' || 'true' }}
        run: node scripts/deploy-regions.mjs
