#:schema node_modules/wrangler/config-schema.json
name = "xget"
main = "src/region-router.js"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat", "cache_option_enabled"]
workers_dev = false

[vars]
ACTIVE_REGION = "hk"

[[services]]
binding = "XGET_HK"
service = "xget-hk"

[[services]]
binding = "XGET_SG"
service = "xget-sg"

[[services]]
binding = "XGET_JP"
service = "xget-jp"

[[services]]
binding = "XGET_TW"
service = "xget-tw"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
